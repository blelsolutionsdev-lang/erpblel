<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThermoTech ERP</title>
    <script>
      // Aplica o tema antes da primeira pintura para a tela não piscar branco.
      try {
        var salvo = localStorage.getItem('erpblel-tema') || 'system'
        var escuro =
          salvo === 'dark' ||
          (salvo === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', escuro)
        document.documentElement.style.colorScheme = escuro ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
